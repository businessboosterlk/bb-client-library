<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Library Admin · Business Booster</title>
<style>
/* SM editor for the Client Library. BB staff surface, shared-anon posture like
   the SMM Workspace. Every write lands in bb_library_items; casts rebuild from
   there, so nothing an SM does here needs the development team. */
:root{--bg:#f5f5f7;--surface:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:rgba(29,29,31,.11);
  --brand:#2563eb;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}html,body{overscroll-behavior-y:none}
@media (pointer:coarse){input,select,textarea{font-size:16px!important}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#gate.off{display:none}
#gate input{width:170px;height:54px;text-align:center;font-size:22px;letter-spacing:.3em;
  border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
#gate input:focus{outline:none;border-color:var(--brand)}
#gate p{margin-top:14px;color:var(--muted);font-size:13px}
header{position:sticky;top:0;z-index:50;background:rgba(245,245,247,.9);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding-top:var(--sat)}
.hin{max-width:900px;margin:0 auto;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.hin strong{font-size:15px}
select,input[type=text],input[type=url]{min-height:42px;padding:0 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
main{max-width:900px;margin:0 auto;padding:16px 18px calc(40px + var(--sab))}
.tabs{display:flex;gap:8px;margin:6px 0 16px;overflow-x:auto}
.tabs button{min-height:38px;padding:0 15px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;flex:0 0 auto}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 15px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item strong{font-size:14.5px}
.item .sub{grid-column:1;color:var(--muted);font-size:12.5px;word-break:break-all}
.item.hid strong,.item.hid .sub{opacity:.4;text-decoration:line-through}
.item .ops{grid-row:1/3;display:flex;gap:6px;align-items:center}
.ops button{min-width:44px;min-height:36px;border:1px solid var(--line);border-radius:9px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.ops button.danger{color:#c62828}
.addbar{display:grid;gap:8px;padding:14px 15px;background:var(--bg);border-top:1px solid var(--line)}
.addbar .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addbar button{min-height:44px;border:0;border-radius:11px;background:var(--brand);color:#fff;
  font:inherit;font-weight:650;cursor:pointer}
.note{padding:12px 2px;color:var(--muted);font-size:12.5px}
#toast{position:fixed;left:50%;bottom:calc(24px + var(--sab));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:300}
#toast.on{opacity:1}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:13.5px}
</style>
</head>
<body>
<div id="gate">
  <div style="text-align:center">
    <img src="assets/bb-logo.png" alt="Business Booster" style="height:24px;margin-bottom:24px;opacity:.85">
    <div><input id="staffpin" inputmode="numeric" maxlength="4" placeholder="••••" aria-label="Staff code" autocomplete="off"></div>
    <p>Library admin. Staff code required.</p>
  </div>
</div>

<header><div class="hin">
  <strong>Library Admin</strong>
  <select id="client" aria-label="Client"></select>
  <select id="month" aria-label="Month"></select>
  <a id="view" href="#" target="_blank" rel="noreferrer" style="margin-left:auto;font-size:13px;color:var(--brand);font-weight:600;text-decoration:none">Open client view</a>
</div></header>

<main>
  <div class="tabs" id="tabs"></div>
  <div class="card"><div id="list"></div><div class="addbar" id="addbar"></div></div>
  <p class="note" id="hint"></p>
</main>
<div id="toast" aria-live="polite"></div>

<script>
(function(){
"use strict";
var BASE='https://yyviiwnqgphyklcoijyd.supabase.co/rest/v1';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5dmlpd25xZ3BoeWtsY29panlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MjE5OTEsImV4cCI6MjA5MTI5Nzk5MX0.I8YiBr-rfLVcc6DE8Z1PxEP2oxXCelv6mxqAY_wY7lc';
var STAFF_HASH='de5d09fc0ab3378669e13413f9d981c424b4d4185b17ef9a69412da3e8669109';
var H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation'};

function api(method,path,body){
  return fetch(BASE+path,{method:method,headers:H,body:body?JSON.stringify(body):undefined})
    .then(function(r){ if(!r.ok) throw new Error(method+' '+path+' -> '+r.status);
      return r.status===204?null:r.json(); });
}
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('on');},2200); }

/* gate */
var gate=document.getElementById('gate'), pin=document.getElementById('staffpin');
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s))
  .then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')});}
pin.addEventListener('input',function(){
  pin.value=pin.value.replace(/\D/g,'').slice(0,4);
  if(pin.value.length===4) sha(pin.value+':bblib-admin').then(function(h){
    if(h===STAFF_HASH){ try{sessionStorage.setItem('bblib_admin','1')}catch(e){} gate.classList.add('off'); boot(); }
    else { pin.value=''; toast('Wrong code'); }
  });
});
try{ if(sessionStorage.getItem('bblib_admin')==='1'){ gate.classList.add('off'); boot(); } }catch(e){}

/* state */
var clients=[], items=[], slug=null, kind='video', month=defaultMonth();
var KINDS=[['video','Videos'],['post','Posts'],['doc','Documents'],['fact','Business facts']];
function defaultMonth(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthOptions(){ var out=[],d=new Date();
  for(var i=0;i<12;i++){ var y=d.getFullYear(),m=d.getMonth()+1;
    out.push(y+'-'+String(m).padStart(2,'0')); d.setMonth(d.getMonth()-1); } return out; }

function boot(){
  api('GET','/bb_library_clients?select=slug,name&active=eq.true&order=name').then(function(cs){
    clients=cs; var sel=document.getElementById('client'); sel.innerHTML='';
    if(!cs.length){ document.getElementById('list').innerHTML='<div class="empty">No clients yet. Ask the machine to scaffold one with new-cast.py.</div>'; return; }
    cs.forEach(function(c){ var o=document.createElement('option'); o.value=c.slug; o.textContent=c.name; sel.appendChild(o); });
    slug=cs[0].slug; sel.onchange=function(){ slug=sel.value; load(); };
    var ms=document.getElementById('month'); ms.innerHTML='';
    monthOptions().forEach(function(m){ var o=document.createElement('option'); o.value=m; o.textContent=m; ms.appendChild(o); });
    ms.value=month; ms.onchange=function(){ month=ms.value; render(); };
    var tabs=document.getElementById('tabs'); tabs.innerHTML='';
    KINDS.forEach(function(k){ var b=document.createElement('button'); b.type='button'; b.textContent=k[1];
      b.onclick=function(){ kind=k[0]; render(); }; tabs.appendChild(b); });
    load();
  }).catch(function(e){ toast('Load failed: '+e.message); });
}
function load(){
  document.getElementById('view').href='index.html?c='+encodeURIComponent(slug);
  api('GET','/bb_library_items?select=*&client_slug=eq.'+encodeURIComponent(slug)+'&order=sort,id')
    .then(function(rs){ items=rs; render(); })
    .catch(function(e){ toast('Load failed: '+e.message); });
}
function render(){
  var tabs=document.getElementById('tabs');
  Array.prototype.forEach.call(tabs.children,function(b,i){ b.classList.toggle('on',KINDS[i][0]===kind); });
  var monthly = kind==='video'||kind==='post';
  document.getElementById('month').style.display = monthly?'':'none';
  var list=document.getElementById('list'); list.innerHTML='';
  var rows=items.filter(function(i){ return i.kind===kind && (!monthly || i.month===month); });
  if(!rows.length){ list.innerHTML='<div class="empty">Nothing here yet. Add the first one below.</div>'; }
  rows.forEach(function(r){
    var d=document.createElement('div'); d.className='item'+(r.hidden?' hid':'');
    d.innerHTML='<strong></strong><span class="ops">'+
      '<button type="button" data-op="hide"></button>'+
      '<button type="button" data-op="del" class="danger">Remove</button></span>'+
      '<span class="sub"></span>';
    d.querySelector('strong').textContent=r.title;
    d.querySelector('.sub').textContent=(r.sub?r.sub+' · ':'')+(r.url||'no link');
    d.querySelector('[data-op=hide]').textContent=r.hidden?'Show':'Hide';
    d.querySelector('[data-op=hide]').onclick=function(){
      api('PATCH','/bb_library_items?id=eq.'+r.id,{hidden:!r.hidden})
        .then(function(){ r.hidden=!r.hidden; render(); toast(r.hidden?'Hidden from client':'Visible to client'); })
        .catch(function(e){ toast(e.message); });
    };
    d.querySelector('[data-op=del]').onclick=function(){
      if(!confirm('Remove "'+r.title+'" for good? Hide is safer.')) return;
      api('DELETE','/bb_library_items?id=eq.'+r.id)
        .then(function(){ items=items.filter(function(x){return x.id!==r.id}); render(); toast('Removed'); })
        .catch(function(e){ toast(e.message); });
    };
    list.appendChild(d);
  });
  var labels={video:['Video title','Note, like: Final cut · 42 seconds','Google Drive link'],
              post:['Post title','Date line, like: 28 Aug · Instagram','Post link (optional)'],
              doc:['Document title','Kind, like: Monthly report','Link to the document'],
              fact:['Fact label, like: What you sell','The fact itself','']};
  var L=labels[kind];
  var bar=document.getElementById('addbar');
  bar.innerHTML='<input type="text" id="a-title" placeholder="'+L[0]+'">'+
    '<div class="r2"><input type="text" id="a-sub" placeholder="'+L[1]+'">'+
    (L[2]?'<input type="url" id="a-url" placeholder="'+L[2]+'">':'<span></span>')+'</div>'+
    '<button type="button" id="a-go">Add to library</button>';
  document.getElementById('a-go').onclick=function(){
    var title=document.getElementById('a-title').value.trim();
    var sub=document.getElementById('a-sub').value.trim();
    var urlEl=document.getElementById('a-url');
    var url=urlEl?urlEl.value.trim():'';
    if(!title){ toast('A title is needed'); return; }
    if(url && !/^https:\/\//.test(url)){ toast('Links must start with https://'); return; }
    api('POST','/bb_library_items',{client_slug:slug,kind:kind,
        month:(kind==='video'||kind==='post')?month:null,title:title,sub:sub,url:url})
      .then(function(rs){ items.push(rs[0]); render(); toast('Added. It reaches the client at the next rebuild.'); })
      .catch(function(e){ toast(e.message); });
  };
  document.getElementById('hint').textContent = kind==='fact'
    ? 'Facts show under "Your business" on the client page. Keep them things the client already knows and would be glad to see written down.'
    : 'Changes land on the client page at the next rebuild, within the hour. Hide beats remove: hidden items keep their history.';
}
})();
</script>
</body>
</html>
